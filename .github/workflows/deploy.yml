name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Hosted ON PURPOSE. This repo is not a fleet member: it has no entry in
    # hadoku_site's fleet-runner-coverage.json and zero runner registrations,
    # so `self-hosted,hadoku-builder` here queues forever with nothing able to
    # serve it. See allowHosted in scripts/admin/repo-policy-manifest.json.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # No `version:` input - action-setup reads pnpm from package.json's
      # `packageManager` field (single source of truth; specifying both errors).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # pnpm via corepack, pinned by the `packageManager` field in package.json.
      # Replaces pnpm/action-setup, whose self-installer shares one directory
      # across every runner instance on the host and dies with
      # `ENOENT ... uv_cwd` when concurrent jobs race it.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build with Next.js
        run: pnpm run build
      
      - name: Create .nojekyll file
        run: touch ./out/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 