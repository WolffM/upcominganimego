packages:
  - .

# Native modules that must run install scripts to compile bindings.
# pnpm blocks dep build scripts by default (malicious-postinstall defense).
allowBuilds:
  esbuild: true
  sharp: true

# Supply-chain: dependency cooldown. External packages must be 7 days old before they
# resolve — malicious npm releases are near-always caught within hours, so we let the
# ecosystem find them first.
#
# @wolffm/* is EXEMPT. It is the cross-ecosystem deploy path and must install immediately;
# an age gate stalls the chain. This supersedes 6124c1f, which set `minimumReleaseAge: 0`
# to keep @wolffm auto-sync unblocked — the exclude achieves that without giving up the
# cooldown on third-party packages.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@wolffm/*"
